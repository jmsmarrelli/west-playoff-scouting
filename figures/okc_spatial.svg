   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d6b70" transform="translate(630 483.452344)">attributing the pattern to a coverage</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d6b70" transform="translate(630 500.219531)">choice.</text>
  </g>
