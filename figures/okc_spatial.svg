  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d36" x="630" y="422.178281" transform="rotate(-0 630 422.178281)">Turn a map into a question</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d6b70" transform="translate(630 451.952344)">Which actions produce the extra corner</text>
